<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            background:#0b0b0b;
            color:white;

            display:flex;
            justify-content:center;
            align-items:center;

            height:100vh;

        }

        .login-box{

            width:400px;

            background:#171717;

            padding:40px;

            border-radius:20px;

            border:1px solid rgba(255,255,255,.08);

        }

        h2{

            text-align:center;

            margin-bottom:30px;

        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:none;

            border-radius:10px;

            outline:none;

        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#00f5ff;

            font-size:17px;

            font-weight:bold;

            cursor:pointer;

        }

        button:hover{

            opacity:.9;

        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Email"
            required>

        <input
            id="password"
            type="password"
            placeholder="Password"
            required>

        <button type="submit">

            Login

        </button>

    </form>

</div>

<script src="login.js"></script>

</body>

</html>
