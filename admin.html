<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        body{
            background:#0b0b0b;
            color:#fff;
            font-family:Arial,Helvetica,sans-serif;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        .dashboard{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;

        }

        .card{

            background:#171717;
            border-radius:20px;
            padding:30px;
            text-align:center;

            border:1px solid rgba(255,255,255,.08);

        }

        .card h2{

            color:#3B82F6;
            font-size:20px;
            margin-bottom:20px;

        }

        .number{

            font-size:50px;
            font-weight:bold;

        }
        .top-bar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:40px;

}

#logoutBtn{

    padding:12px 22px;

    border:none;

    border-radius:10px;

    background:#ff4d4d;

    color:white;

    font-size:15px;

    cursor:pointer;

    transition:.3s;

}

#logoutBtn:hover{

    background:#e63946;

}

    </style>

</head>

<body>


<div class="top-bar">

    <h1>📊 Portfolio Dashboard</h1>

    <button id="logoutBtn">Logout</button>

</div>

<div class="dashboard">

    <div class="card">

        <h2>Total Visitors</h2>

        <div class="number" id="visitorCount">0</div>

    </div>

    <div class="card">

        <h2>Contact Messages</h2>

        <div class="number" id="messageCount">0</div>

    </div>

</div>
<div class="card">

    <h2>Today's Visitors</h2>

    <div class="number" id="todayVisitors">0</div>

</div>
<div class="card">

    <h2>Resume Views</h2>

    <div class="number" id="resumeViews">0</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="dashboard.js"></script>

</body>

</html>
